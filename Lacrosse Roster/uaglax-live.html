<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<title>UAGLAX — Live</title>
<link rel="icon" href="UA logo.webp">
<style>
  :root {
    --black: #1a1a1a;
    --gold: #F7C414;
    --gold-light: #FACE4B;
    --gold-dark: #D4A30E;
    --gold-bg: #FFFBEB;
    --white: #ffffff;
    --gray-50: #fafafa;
    --gray-100: #f5f5f5;
    --gray-200: #e5e5e5;
    --gray-400: #a3a3a3;
    --gray-500: #737373;
    --gray-700: #404040;
    --gray-900: #171717;
    --green: #15803d;
    --red: #b91c1c;
    --blue: #1d4ed8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--gray-50); color: var(--black); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  body {
    min-height: 100vh;
    padding: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ===================================================================
     SCOREBOARD — sticky at top.
     Big enough that parents glance at the URL and know the score.
     =================================================================== */
  .scoreboard {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--black);
    color: var(--white);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .sb-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray-400);
  }
  .sb-live-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(247, 196, 20, 0.16);
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 1.5px;
  }
  .sb-live-chip.is-final {
    background: rgba(255,255,255,0.08);
    color: var(--gray-400);
  }
  .sb-live-chip.is-pregame {
    background: rgba(255,255,255,0.08);
    color: var(--gray-400);
  }
  .sb-live-chip .dot {
    width: 8px; height: 8px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .sb-live-chip.is-final .dot,
  .sb-live-chip.is-pregame .dot {
    background: var(--gray-500);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }
  .sb-period {
    color: var(--white);
    font-weight: 700;
    letter-spacing: 1.5px;
  }

  .sb-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }
  .sb-team {
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .sb-team.home { text-align: left; }
  .sb-team.away { text-align: right; }
  .sb-team-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--white);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sb-team-sub {
    font-size: 10px;
    color: var(--gray-400);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .sb-score-block {
    display: flex; align-items: center; gap: 14px;
    font-size: 44px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .sb-score-block .dash {
    font-size: 28px;
    color: var(--gray-500);
    font-weight: 500;
    transform: translateY(-3px);
  }
  .sb-meta {
    display: flex; justify-content: space-between;
    margin-top: 10px;
    font-size: 11px;
    color: var(--gray-400);
    letter-spacing: 0.5px;
  }
  .sb-meta .updated { color: var(--gray-400); }
  .sb-meta .updated.fresh { color: var(--gold); }

  /* ===================================================================
     LATEST EVENT TICKER — right below scoreboard. Flashes on new event.
     =================================================================== */
  .ticker {
    background: var(--black);
    color: var(--white);
    padding: 0 16px 12px;
    border-bottom: 3px solid var(--gold);
  }
  .ticker-inner {
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    transition: background 0.3s ease;
    min-height: 44px;
  }
  .ticker-inner.flash {
    background: var(--gold);
    color: var(--black);
  }
  .ticker-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    white-space: nowrap;
  }
  .ticker-inner.flash .ticker-label { color: var(--black); }
  .ticker-text {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  /* ===================================================================
     MAIN FEED — list of events grouped by period.
     =================================================================== */
  .feed-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 12px 32px;
  }
  .period-group + .period-group { margin-top: 18px; }
  .period-header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-500);
    font-weight: 700;
  }
  .period-header::before, .period-header::after {
    content: ''; flex: 1; height: 1px; background: var(--gray-200);
  }
  .period-header .in-progress {
    color: var(--gold-dark);
    font-weight: 800;
  }

  .event-row {
    display: grid;
    grid-template-columns: 56px auto 1fr;
    align-items: center;
    gap: 12px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .event-row.is-new {
    border-color: var(--gold);
    background: var(--gold-bg);
    animation: rowFlash 1.6s ease-out;
  }
  @keyframes rowFlash {
    0% { background: var(--gold); }
    100% { background: var(--gold-bg); }
  }
  .event-clock {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--gray-700);
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  /* Pill colors mirror the stat keeper app's button palette so parents and
     the sideline keeper see the same color language. Goals (both sides) get
     SOLID pills because they're the marquee events; everything else is a
     soft tint of the same hue family. Map:
       Goal       → green   (solid)
       Opp Goal   → red     (solid)
       Assist     → light green tint
       Save       → light green tint
       Shot       → light blue tint
       SOG        → stronger blue tint
       Draw Ctrl  → light purple tint
       Draw Lost  → softer purple tint
       Ground Ball→ gold/yellow tint
       Missed GB  → lighter yellow tint
       Caused TO  → orange tint
       Turnover   → red tint */
  .event-type {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--gray-100);
    color: var(--gray-700);
    white-space: nowrap;
  }
  .event-type.goal              { background: #16a34a; color: #ffffff; }
  .event-type.opp-goal          { background: #dc2626; color: #ffffff; }
  .event-type.assist            { background: #dcfce7; color: #16a34a; }
  .event-type.save              { background: #dcfce7; color: #15803d; }
  .event-type.shot              { background: #2563eb; color: #ffffff; }
  .event-type.sog               { background: #bfdbfe; color: #1e40af; }
  .event-type.draw-control      { background: #7c3aed; color: #ffffff; }
  .event-type.draw-lost         { background: #ddd6fe; color: #6d28d9; }
  .event-type.ground-ball       { background: #ea580c; color: #ffffff; }
  .event-type.missed-gb         { background: #fed7aa; color: #9a3412; }
  .event-type.caused-turnover   { background: #F7C414; color: #1a1a1a; }
  .event-type.turnover          { background: #fee2e2; color: #b91c1c; }
  .event-type.yellow-card       { background: #facc15; color: #1a1a1a; }
  .event-player {
    font-size: 14px;
    font-weight: 600;
    color: var(--black);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-player .jersey {
    display: inline-block;
    background: var(--black);
    color: var(--gold);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    margin-right: 6px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .event-player.opp { color: var(--gray-500); font-style: italic; }

  /* Empty / loading / error states */
  .state-card {
    margin: 24px 12px;
    padding: 32px 20px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 14px;
    text-align: center;
    color: var(--gray-700);
  }
  .state-card h2 {
    font-size: 18px;
    margin-bottom: 8px;
    color: var(--black);
  }
  .state-card p { font-size: 14px; color: var(--gray-500); }
  .state-card .next-game {
    margin-top: 16px;
    padding: 12px;
    background: var(--gold-bg);
    border: 1px solid var(--gold);
    border-radius: 10px;
    font-size: 13px;
    color: var(--gray-700);
    font-weight: 600;
  }
  .state-card .next-game .opp { color: var(--black); font-weight: 800; }

  /* Footer — small "view on roster site" link */
  .footer-link {
    text-align: center;
    padding: 18px 16px 28px;
    font-size: 12px;
    color: var(--gray-500);
  }
  .footer-link a { color: var(--gold-dark); text-decoration: none; font-weight: 700; }
  .footer-link a:hover { text-decoration: underline; }
  /* Admin toggle pill. Subtle gray by default — parents see it but it doesn't
     scream for attention. Tap to enter PIN. Goes gold when active. Tap again
     to drop back to public. */
  .admin-badge {
    display: inline-block;
    background: var(--gray-100);
    color: var(--gray-400);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-left: 8px;
    border: 1px solid var(--gray-200);
    cursor: pointer;
    text-transform: uppercase;
    user-select: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .admin-badge:hover { background: var(--gray-200); color: var(--gray-500); }
  .admin-badge.active {
    background: var(--gold);
    color: var(--black);
    border-color: var(--gold);
    font-weight: 800;
  }
  .admin-badge.active:hover { filter: brightness(1.05); background: var(--gold); }

  /* Connection banner — only when worker is unreachable */
  .conn-banner {
    background: var(--red);
    color: var(--white);
    padding: 8px 16px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
  }
  .conn-banner[hidden] { display: none; }

  /* PIN modal for admin unlock */
  .pin-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 200;
  }
  .pin-modal[hidden] { display: none; }
  .pin-card {
    background: var(--white);
    padding: 24px;
    border-radius: 14px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .pin-card h3 { font-size: 18px; margin-bottom: 6px; }
  .pin-card p { color: var(--gray-500); font-size: 13px; margin-bottom: 14px; }
  .pin-card input {
    width: 100%;
    font-size: 18px;
    padding: 12px;
    border: 2px solid var(--gray-200);
    border-radius: 8px;
    text-align: center;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
  }
  .pin-card input:focus { outline: none; border-color: var(--gold); }
  .pin-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pin-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  .pin-cancel { background: var(--gray-100); color: var(--gray-700); }
  .pin-confirm { background: var(--black); color: var(--gold); }
  .pin-error { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 14px; }

  @media (max-width: 360px) {
    .sb-score-block { font-size: 38px; gap: 10px; }
    .sb-team-name { font-size: 12px; }
    .event-row { grid-template-columns: 48px auto 1fr; gap: 8px; padding: 8px 10px; }
    .event-clock { font-size: 12px; }
    .event-type { font-size: 10px; padding: 2px 6px; }
    .event-player { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- ─── Sticky scoreboard ─────────────────────────────────── -->
<div class="scoreboard" id="scoreboard">
  <div class="sb-top-row">
    <span class="sb-live-chip" id="liveChip"><span class="dot"></span><span id="liveChipLabel">LIVE</span></span>
    <span class="sb-period" id="sbPeriod">—</span>
  </div>
  <div class="sb-teams">
    <div class="sb-team home">
      <div class="sb-team-name" id="homeName">UA</div>
      <div class="sb-team-sub" id="homeSub">Golden Bears</div>
    </div>
    <div class="sb-score-block">
      <span id="homeScore">0</span>
      <span class="dash">—</span>
      <span id="awayScore">0</span>
    </div>
    <div class="sb-team away">
      <div class="sb-team-name" id="awayName">—</div>
      <div class="sb-team-sub" id="awaySub">Opponent</div>
    </div>
  </div>
  <div class="sb-meta">
    <span id="venueInfo"></span>
    <span class="updated" id="lastUpdated">…</span>
  </div>
</div>

<!-- ─── Connection banner (hidden by default) ────────────── -->
<div class="conn-banner" id="connBanner" hidden>Reconnecting…</div>

<!-- ─── Latest-event ticker ───────────────────────────────── -->
<div class="ticker" id="ticker" hidden>
  <div class="ticker-inner" id="tickerInner">
    <span class="ticker-label">Latest</span>
    <span class="ticker-text" id="tickerText">—</span>
  </div>
</div>

<!-- ─── Main feed area ────────────────────────────────────── -->
<div class="feed-wrap" id="feedWrap">
  <div class="state-card" id="initialState">
    <h2>Loading…</h2>
    <p>Pulling latest from the worker.</p>
  </div>
</div>

<div class="footer-link">
  <a href="index.html">← Full roster &amp; schedule</a>
  <button type="button" id="adminBadge" class="admin-badge" onclick="onAdminPillTap()">Admin</button>
</div>

<!-- PIN entry modal -->
<div class="pin-modal" id="pinModal" hidden>
  <div class="pin-card">
    <h3>Admin View</h3>
    <p>Enter the score-edit PIN to see every stat type (shots, ground balls, draw controls, etc).</p>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="••••" autocomplete="off" onkeydown="if (event.key === 'Enter') confirmAdmin();">
    <div class="pin-error" id="pinError"></div>
    <div class="pin-actions">
      <button class="pin-cancel" onclick="cancelAdmin()">Cancel</button>
      <button class="pin-confirm" onclick="confirmAdmin()">Unlock</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// CONFIG
// ============================================================================
const API_BASE             = 'https://vh-api.charles-9e5.workers.dev';
const POLL_INTERVAL        = 6000;     // ms — events refresh cadence (while live)
const GAMES_INTERVAL_LIVE  = 30000;    // ms — game record refresh (live game)
const GAMES_INTERVAL_WAIT  = 8000;     // ms — faster poll when waiting for a
                                       // game to start (no game / pregame state),
                                       // so the page flips to LIVE within seconds
                                       // of the stats keeper hitting Start Game.
const PIN_KEY              = 'uaglax_score_pin_v1';  // matches the stats app + roster

// Events visible in PUBLIC mode. Admin mode shows everything.
const PUBLIC_TYPES = new Set(['Goal', 'Assist', 'Save', 'Opp Goal', 'Period Start', 'Yellow Card']);

// ============================================================================
// STATE
// ============================================================================
const state = {
  game:        null,    // current "live" game record
  events:      [],      // events for current game
  knownIds:    new Set(),// event recordIds we've already seen (for flashing)
  initialLoad: true,
  adminMode:   false,
  pin:         '',
  pollTimer:   null,
  gamesTimer:  null,
  online:      true,
  lastFetchMs: 0
};

// ============================================================================
// UTILITIES
// ============================================================================
function $(id) { return document.getElementById(id); }

function todayEasternISO() {
  // YYYY-MM-DD in America/New_York. en-CA gives ISO order.
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
}

function qLabel(p) {
  if (p == null) return '';
  if (p === 5) return 'OT';
  if (p > 5) return 'OT' + (p - 4);
  return 'Q' + p;
}

function fmtRelative(ms) {
  if (!ms) return '';
  const sec = Math.floor((Date.now() - ms) / 1000);
  if (sec < 5)   return 'just now';
  if (sec < 60)  return sec + 's ago';
  const min = Math.floor(sec / 60);
  if (min < 60)  return min + 'm ago';
  const hr = Math.floor(min / 60);
  return hr + 'h ago';
}

function classFor(statType) {
  return (statType || '').toLowerCase().replace(/\s+/g, '-');
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

// ============================================================================
// ADMIN TOGGLE
// The footer "Admin" pill is always visible. Tap when public → opens PIN
// modal. Tap when admin → switches back to public (no PIN required to leave).
// PIN is validated against the worker's /lacrosse/stats/verify endpoint so
// wrong PINs get rejected instead of silently "succeeding".
// ============================================================================
function reflectAdminPill() {
  const pill = $('adminBadge');
  if (!pill) return;
  pill.classList.toggle('active', !!state.adminMode);
  pill.textContent = state.adminMode ? 'ADMIN' : 'Admin';
}

function maybeAutoAdmin() {
  // If a PIN is already saved in this browser AND ?admin=1 was used at some
  // point, treat as still-admin. Validate it asynchronously in the background
  // — if it's been rotated since, silently revert to public.
  const saved = localStorage.getItem(PIN_KEY) || '';
  if (!saved) return;
  // Quietly re-verify in the background; flip off if stale.
  verifyPinWithServer(saved).then(function (ok) {
    if (ok) {
      state.pin = saved;
      state.adminMode = true;
      reflectAdminPill();
      renderFeed();
    } else {
      localStorage.removeItem(PIN_KEY);
    }
  }).catch(function () { /* offline — leave saved state untouched */ });
}

function onAdminPillTap() {
  if (state.adminMode) {
    // Toggle off — no PIN required to leave admin
    state.adminMode = false;
    state.pin = '';
    localStorage.removeItem(PIN_KEY);
    reflectAdminPill();
    renderFeed();
    return;
  }
  // Open PIN modal
  $('pinInput').value = '';
  $('pinError').textContent = '';
  $('pinModal').hidden = false;
  setTimeout(function () { $('pinInput').focus(); }, 50);
}

async function verifyPinWithServer(pin) {
  try {
    const res = await fetch(API_BASE + '/lacrosse/stats/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-UAGLAX-PIN': pin },
      body: '{}'
    });
    return res.status === 200;
  } catch (e) {
    return false;
  }
}

async function confirmAdmin() {
  const v = ($('pinInput').value || '').trim();
  if (!v) { $('pinError').textContent = 'Enter the PIN.'; return; }
  $('pinError').textContent = 'Checking…';
  const ok = await verifyPinWithServer(v);
  if (!ok) {
    $('pinError').textContent = 'PIN not accepted. Try again.';
    return;
  }
  state.pin = v;
  state.adminMode = true;
  localStorage.setItem(PIN_KEY, v);
  $('pinModal').hidden = true;
  reflectAdminPill();
  renderFeed();
}

function cancelAdmin() {
  $('pinModal').hidden = true;
}

// ============================================================================
// API CALLS
// ============================================================================
async function fetchGames() {
  try {
    // ?_=timestamp bypasses any CDN-level caching that might serve a 30s-old
    // games list (Cloudflare's edge ignores no-store on cross-origin GETs).
    const res = await fetch(API_BASE + '/lacrosse/stats/games?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.online = true;
    $('connBanner').hidden = true;
    return data.games || [];
  } catch (err) {
    state.online = false;
    $('connBanner').hidden = false;
    console.error('Games fetch failed', err);
    return null;
  }
}

async function fetchEvents(gameId) {
  if (!gameId) return [];
  try {
    const res = await fetch(API_BASE + '/lacrosse/stats/events?gameId=' + encodeURIComponent(gameId) + '&_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.online = true;
    $('connBanner').hidden = true;
    state.lastFetchMs = Date.now();
    return data.events || [];
  } catch (err) {
    state.online = false;
    $('connBanner').hidden = false;
    console.error('Events fetch failed', err);
    return null; // signal "no update"
  }
}

// ============================================================================
// LIVE GAME PICKER
// Priority order (parents loading the page before tip-off should see PREGAME):
//   1. Today's non-final game (with or without a score) — gives a clean
//      pregame state when parents arrive early, and flips to LIVE
//      automatically the moment Start Game is tapped.
//   2. Today's already-final game — still headline today's result.
//   3. Any non-final game with a score, regardless of date — catches games
//      that crossed midnight or had a date typo, but ranks BELOW today so a
//      stale test game can't beat today's real game.
// ============================================================================
function pickLiveGame(games) {
  if (!games || !games.length) return null;
  const today = todayEasternISO();
  const norm = function (g) { return (g.date || '').slice(0, 10); };
  const hasScore = function (g) {
    return typeof g.ourScore === 'number' || typeof g.opponentScore === 'number';
  };

  // 1. Today's non-final game (covers both pregame and live states)
  let live = games.find(function (g) { return norm(g) === today && !g.final; });
  if (live) return live;
  // 2. Today's already-final game — show the result
  live = games.find(function (g) { return norm(g) === today && g.final; });
  if (live) return live;
  // 3. Off-day fallback: any non-final game with a score (e.g., midnight overrun)
  live = games.find(function (g) { return !g.final && hasScore(g); });
  if (live) return live;
  return null;
}

// Is the picked game actually in progress, or just scheduled for today?
// Live = has any score set OR at least one stat event exists.
function gameIsLive(g, events) {
  if (!g) return false;
  if (typeof g.ourScore === 'number' || typeof g.opponentScore === 'number') return true;
  if (events && events.length) return true;
  return false;
}

function pickNextGame(games) {
  if (!games || !games.length) return null;
  const today = todayEasternISO();
  // Games are sorted desc by date. Find the closest upcoming.
  const upcoming = games
    .filter(function (g) { return (g.date || '').slice(0, 10) > today && !g.final; })
    .sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  return upcoming[0] || null;
}

// ============================================================================
// RENDER — scoreboard + ticker + feed
// ============================================================================
function renderScoreboard() {
  const g = state.game;
  const chip = $('liveChip');
  const chipLabel = $('liveChipLabel');
  chip.classList.remove('is-final', 'is-pregame');

  if (!g) {
    chipLabel.textContent = 'NO GAME';
    chip.classList.add('is-pregame');
    $('homeName').textContent = 'UA';
    $('awayName').textContent = '—';
    $('awaySub').textContent = 'Opponent';
    $('homeScore').textContent = '0';
    $('awayScore').textContent = '0';
    $('sbPeriod').textContent = '—';
    $('venueInfo').textContent = '';
    $('lastUpdated').textContent = '';
    return;
  }

  const isLive = gameIsLive(g, state.events);
  if (g.final) {
    chipLabel.textContent = 'FINAL';
    chip.classList.add('is-final');
  } else if (isLive) {
    chipLabel.textContent = 'LIVE';
  } else {
    chipLabel.textContent = 'PREGAME';
    chip.classList.add('is-pregame');
  }

  // UA is always "home" visually, regardless of homeAway field.
  $('homeName').textContent = 'UA';
  $('homeSub').textContent = 'Golden Bears';
  $('awayName').textContent = (g.opponent || 'TBD').toUpperCase();
  $('awaySub').textContent = g.homeAway === 'Home' ? 'Visitors' : (g.homeAway === 'Away' ? 'Hosts' : '');

  // Pregame: show em-dashes instead of 0-0 so it's clear nothing's happened.
  $('homeScore').textContent = (typeof g.ourScore === 'number') ? g.ourScore : (isLive ? '0' : '—');
  $('awayScore').textContent = (typeof g.opponentScore === 'number') ? g.opponentScore : (isLive ? '0' : '—');

  // Period chip — pull from latest Period Start event, else from highest period
  // seen in events, else '—'.
  let curPeriod = null;
  for (let i = state.events.length - 1; i >= 0; i--) {
    if (state.events[i].statType === 'Period Start') { curPeriod = state.events[i].period; break; }
  }
  if (curPeriod == null) {
    state.events.forEach(function (e) {
      if (typeof e.period === 'number' && (curPeriod == null || e.period > curPeriod)) curPeriod = e.period;
    });
  }
  // Period text: FINAL > Qx (live) > tip-off time (pregame, if known) > PREGAME
  if (g.final) {
    $('sbPeriod').textContent = 'FINAL';
  } else if (curPeriod) {
    $('sbPeriod').textContent = qLabel(curPeriod);
  } else if (!isLive && g.time) {
    $('sbPeriod').textContent = String(g.time).toUpperCase();
  } else {
    $('sbPeriod').textContent = isLive ? 'Q1' : 'PREGAME';
  }

  // Venue / location small text
  const venue = (g.homeAway === 'Home' ? 'HOME' : (g.homeAway === 'Away' ? 'AWAY' : '')) +
                (g.location ? ' · ' + g.location.toUpperCase() : '');
  $('venueInfo').textContent = venue;

  // Updated stamp
  const stamp = state.lastFetchMs ? ('Updated ' + fmtRelative(state.lastFetchMs)) : '';
  const upd = $('lastUpdated');
  upd.textContent = stamp;
  upd.classList.toggle('fresh', (Date.now() - state.lastFetchMs) < 4000);
}

function renderTicker() {
  if (!state.events.length) { $('ticker').hidden = true; return; }
  // Most recent event that isn't a Period Start
  const visible = state.events.filter(function (e) {
    return state.adminMode ? true : PUBLIC_TYPES.has(e.statType);
  });
  const latest = visible.filter(function (e) { return e.statType !== 'Period Start'; }).slice(-1)[0];
  if (!latest) { $('ticker').hidden = true; return; }
  $('ticker').hidden = false;
  const txt = formatEventOneLine(latest);
  $('tickerText').textContent = txt;
}

function flashTicker() {
  const t = $('tickerInner');
  t.classList.add('flash');
  setTimeout(function () { t.classList.remove('flash'); }, 1400);
}

function formatEventOneLine(e) {
  const per = qLabel(e.period);
  const clock = e.clock ? (' ' + e.clock) : '';
  if (e.statType === 'Period Start') return 'Start of ' + per;
  const isOppCard = e.statType === 'Yellow Card' && e.jersey == null && !e.playerName;
  const who = (e.statType === 'Opp Goal' || isOppCard)
    ? 'OPP' + (e.note ? ' ' + e.note : '')
    : (e.jersey != null ? '#' + e.jersey + ' ' + lastName(e.playerName) : (e.playerName || ''));
  return per + clock + ' · ' + e.statType.toUpperCase() + (who ? ' · ' + who : '');
}
function lastName(full) { return (full || '').split(' ').slice(-1)[0] || full || ''; }

function renderFeed() {
  const root = $('feedWrap');
  const g = state.game;

  if (!g) {
    // Show "no game" state with next-game callout
    root.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'state-card';
    card.innerHTML =
      '<h2>No game in progress</h2>' +
      '<p>Check back when the next game is underway.</p>' +
      (state._nextGame
        ? '<div class="next-game">Next: <span class="opp">' + escapeHtml(state._nextGame.opponent || 'TBD') + '</span>'
            + ' · ' + escapeHtml(prettyDate(state._nextGame.date))
            + (state._nextGame.time ? ' · ' + escapeHtml(state._nextGame.time) : '')
            + '</div>'
        : '');
    root.appendChild(card);
    return;
  }

  // Pregame: game's on the schedule for today but no score/events yet. Show
  // a friendly placeholder so parents who arrive early know they're in the
  // right place — page will auto-flip to LIVE once the keeper hits Start Game.
  const isLive = gameIsLive(g, state.events);
  if (!isLive && !g.final) {
    root.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'state-card';
    const matchupLine = (g.homeAway === 'Away' ? 'at ' : 'vs ') + escapeHtml(g.opponent || 'TBD');
    const detailParts = [];
    if (g.time)     detailParts.push(escapeHtml(g.time));
    if (g.location) detailParts.push(escapeHtml(g.location));
    if (g.homeAway) detailParts.push(g.homeAway === 'Home' ? 'HOME' : 'AWAY');
    card.innerHTML =
      '<h2>Pregame</h2>' +
      '<p style="font-size:15px;color:var(--black);font-weight:600;letter-spacing:0.3px;">' + matchupLine + '</p>' +
      (detailParts.length ? '<p style="margin-top:6px;">' + detailParts.join(' · ') + '</p>' : '') +
      '<div class="next-game">Live updates will appear here the moment the game starts. ' +
      'Keep this tab open — no need to refresh.</div>';
    root.appendChild(card);
    return;
  }

  // Filter events to visible set
  const visible = state.events.filter(function (e) {
    return state.adminMode ? true : PUBLIC_TYPES.has(e.statType);
  });

  if (!visible.length) {
    root.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'state-card';
    card.innerHTML =
      '<h2>' + (g.final ? 'Game complete' : 'Game underway') + '</h2>' +
      '<p>' + (g.final
        ? 'Final score above. Detailed stats coming soon.'
        : 'No stats logged yet. Updates will appear here as plays happen.')
      + '</p>';
    root.appendChild(card);
    return;
  }

  // Group by period (descending — newest period first).
  const byPeriod = {};
  visible.forEach(function (e) {
    const p = e.period || 1;
    if (!byPeriod[p]) byPeriod[p] = [];
    byPeriod[p].push(e);
  });
  const periods = Object.keys(byPeriod).map(Number).sort(function (a, b) { return b - a; });

  // Current period for "in progress" tag
  let curPeriod = null;
  for (let i = state.events.length - 1; i >= 0; i--) {
    if (state.events[i].statType === 'Period Start') { curPeriod = state.events[i].period; break; }
  }
  if (curPeriod == null && periods.length) curPeriod = periods[0];

  let html = '';
  periods.forEach(function (p) {
    const inProg = (p === curPeriod && !g.final);
    html += '<div class="period-group">';
    html += '<div class="period-header">' + qLabel(p)
         + (inProg ? ' <span class="in-progress">· IN PROGRESS</span>' : '')
         + '</div>';
    // Within a period, show newest event first.
    byPeriod[p].slice().reverse().forEach(function (e) {
      if (e.statType === 'Period Start') return; // shown only in header
      const isNew = !state.initialLoad && e.recordId && !state.knownIds.has(e.recordId);
      html += renderEventRow(e, isNew);
    });
    html += '</div>';
  });
  root.innerHTML = html;
}

function renderEventRow(e, isNew) {
  const cls = 'event-row' + (isNew ? ' is-new' : '');
  const clock = (e.clock || '').trim() || (qLabel(e.period) || '');
  const typeClass = classFor(e.statType);
  const typeLabel = e.statType.toUpperCase();
  let who = '';
  if (e.statType === 'Opp Goal') {
    who = '<span class="event-player opp">Opponent</span>';
  } else if (e.statType === 'Yellow Card' && e.jersey == null && !e.playerName) {
    who = '<span class="event-player opp">Opponent' + (e.note ? ' ' + escapeHtml(e.note) : '') + '</span>';
  } else if (e.statType === 'Missed GB' || e.statType === 'Draw Lost') {
    who = '<span class="event-player opp">Team</span>';
  } else if (e.jersey != null || e.playerName) {
    who = '<span class="event-player">'
        + (e.jersey != null ? '<span class="jersey">' + escapeHtml(String(e.jersey)) + '</span>' : '')
        + escapeHtml(e.playerName || '')
        + '</span>';
  } else {
    who = '<span class="event-player opp">—</span>';
  }
  return '<div class="' + cls + '">'
       + '<div class="event-clock">' + escapeHtml(clock) + '</div>'
       + '<div><span class="event-type ' + typeClass + '">' + escapeHtml(typeLabel) + '</span></div>'
       + who
       + '</div>';
}

function prettyDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/New_York' });
}

// ============================================================================
// POLLING LOOP
// ============================================================================
async function refreshGames() {
  const games = await fetchGames();
  if (games === null) { renderScoreboard(); return; } // offline, render last-known
  const next = pickLiveGame(games);
  state._nextGame = pickNextGame(games);
  if (next && (!state.game || state.game.recordId !== next.recordId)) {
    // New game became "live" — reset event history so we don't flash a year of old events.
    state.game = next;
    state.events = [];
    state.knownIds = new Set();
    state.initialLoad = true;
    await refreshEvents(true);
  } else if (next) {
    // Update score / final on existing game record
    state.game = next;
  } else {
    state.game = null;
  }
  renderScoreboard();
  renderFeed();
  // If we just transitioned out of "waiting for game to start" into live (or
  // vice versa), restart polling at the appropriate cadence.
  ensurePollingCadence();
}

async function refreshEvents(force) {
  if (!state.game) return;
  const newEvents = await fetchEvents(state.game.recordId);
  if (newEvents === null) return; // offline — keep old data
  // Detect if any new event arrived → flash ticker
  let hasNew = false;
  if (!state.initialLoad) {
    newEvents.forEach(function (e) {
      if (e.recordId && !state.knownIds.has(e.recordId)) hasNew = true;
    });
  }
  state.events = newEvents;
  renderScoreboard();
  renderTicker();
  renderFeed();
  if (hasNew) flashTicker();
  // Update known set AFTER render so "is-new" highlight gets a chance
  newEvents.forEach(function (e) { if (e.recordId) state.knownIds.add(e.recordId); });
  state.initialLoad = false;
  // The first event flips a pregame game to live — adjust polling cadence.
  ensurePollingCadence();
}

function startPolling() {
  stopPolling();
  // Events poll always at the fast rate while a game is live; harmless when
  // there's no game (the fetch short-circuits inside refreshEvents).
  state.pollTimer = setInterval(refreshEvents, POLL_INTERVAL);
  // Games poll cadence depends on whether we're waiting for one to start.
  // pregame / no-game → faster (8s) so Start Game shows up quickly.
  // live → slower (30s) since the events poll handles the bulk of updates.
  const waitingForStart = !state.game || !gameIsLive(state.game, state.events);
  const interval = waitingForStart ? GAMES_INTERVAL_WAIT : GAMES_INTERVAL_LIVE;
  state.gamesTimer = setInterval(refreshGames, interval);
  state.gamesIntervalMs = interval;
}
function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  if (state.gamesTimer) { clearInterval(state.gamesTimer); state.gamesTimer = null; }
}

// If the desired cadence changes (e.g., game just flipped to live), restart
// polling so the games timer runs at the new interval.
function ensurePollingCadence() {
  if (!state.pollTimer) return;  // not currently polling — nothing to adjust
  const waitingForStart = !state.game || !gameIsLive(state.game, state.events);
  const desired = waitingForStart ? GAMES_INTERVAL_WAIT : GAMES_INTERVAL_LIVE;
  if (desired !== state.gamesIntervalMs) startPolling();
}

// Pause polling when tab is hidden, resume on focus. Mobile browsers
// sometimes throttle background timers more aggressively than the
// visibilitychange API surfaces; the focus + pageshow handlers below
// catch those cases too.
function wakeUp() {
  refreshGames();   // immediate catch-up
  startPolling();
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    stopPolling();
  } else {
    wakeUp();
  }
});
window.addEventListener('focus', function () { if (!document.hidden) wakeUp(); });
window.addEventListener('pageshow', function () { if (!document.hidden) wakeUp(); });

// ============================================================================
// BOOT
// ============================================================================
(async function init() {
  reflectAdminPill();        // start in public mode; pill shows "Admin" (subtle)
  maybeAutoAdmin();          // re-validate any saved PIN in the background
  await refreshGames();
  startPolling();
  // Refresh the "updated ago" text every 5s so it doesn't go stale.
  setInterval(function () { if (state.game) renderScoreboard(); }, 5000);
})();
</script>
</body>
</html>
